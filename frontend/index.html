<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoolBlocks</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">CoolBlocks <span>How much cooler could this street be?</span></div>
    <div class="tools" id="tools">
      <button data-tool="pan" class="active" title="Move around">✋ Pan</button>
      <button data-tool="tree" title="Click to plant a tree">🌳 Tree</button>
      <select id="treeSize" title="Tree size">
        <option value="small">Small (6 m)</option>
        <option value="medium" selected>Medium (10 m)</option>
        <option value="large">Large (15 m)</option>
      </select>
      <button data-tool="remove_trees" title="Draw an area to remove trees">🪓 Remove trees</button>
      <button data-tool="surface" title="Draw an area to change the ground surface">🟩 Surface</button>
      <select id="surfaceType" title="New surface">
        <option value="grass">Grass</option>
        <option value="cool_asphalt">Cool (reflective) asphalt</option>
        <option value="asphalt">Dark asphalt</option>
        <option value="paving">Paving</option>
        <option value="soil">Bare soil</option>
        <option value="water">Water</option>
      </select>
      <button data-tool="building" title="Draw a footprint to add, raise or demolish a building">🏢 Building</button>
      <label class="inline">height <input id="buildingHeight" type="number" min="0" max="250" value="20" step="1"> m</label>
    </div>
    <div class="actions">
      <button id="undo" title="Undo last edit">↶ Undo</button>
      <button id="clear" title="Remove all edits">Clear</button>
      <button id="simulate" class="primary">Simulate</button>
    </div>
  </header>

  <div id="drawHint" class="hint hidden">Click to add corners. Double-click (or Enter) to finish, Esc to cancel.</div>

  <main>
    <section class="pane">
      <div class="pane-title">Real-world view <small>aerial photo + shade</small>
        <span class="toggle">
          <label title="Show existing buildings and trees as 3D blocks on top of the photo"><input type="checkbox" id="blocks"> 3D blocks</label>
          <label title="Show the modelled shade for the selected hour"><input type="checkbox" id="shade" checked> Shade</label>
        </span>
      </div>
      <div id="mapReal" class="map"></div>
    </section>
    <section class="pane">
      <div class="pane-title">Heat view <small id="heatTitle">"feels like" temperature (UTCI)</small>
        <span class="toggle">
          <label><input type="radio" name="heatMode" value="heat" checked> Heat</label>
          <label><input type="radio" name="heatMode" value="change"> Change</label>
        </span>
      </div>
      <div id="mapHeat" class="map"></div>
      <div class="legend" id="legend"></div>
    </section>
  </main>

  <footer>
    <div class="time">
      <label for="hour">Time</label>
      <input id="hour" type="range" min="9" max="18" step="1" value="15">
      <output id="hourLabel">3 pm</output>
      <label class="inline">Day <input id="date" type="date"></label>
      <button id="live" title="Use today's live weather">Live</button>
    </div>
    <div class="card" id="card">Loading the area…</div>
    <div class="status" id="status"></div>
  </footer>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
